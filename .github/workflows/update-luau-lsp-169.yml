name: Update bundled Luau LSP 1.69

on:
  push:
    branches:
      - feature/module-intellisense
    paths:
      - .github/workflows/update-luau-lsp-169.yml
  pull_request:
    branches:
      - feature/module-intellisense
    paths:
      - .github/trigger-luau-lsp-update
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-windows-binary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/module-intellisense

      - name: Download official Luau LSP 1.69.0 Windows release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/JohnnyMorganz/luau-lsp/releases/download/1.69.0/luau-lsp-win64.zip \
            --output /tmp/luau-lsp-win64.zip
          rm -rf /tmp/luau-lsp-win64
          mkdir -p /tmp/luau-lsp-win64
          unzip -q /tmp/luau-lsp-win64.zip -d /tmp/luau-lsp-win64

          binary_path="$(find /tmp/luau-lsp-win64 -type f -name 'luau-lsp.exe' -print -quit)"
          test -n "$binary_path"
          install -m 0755 "$binary_path" Polytoria/native/luau-lsp/windows/luau-lsp.exe

      - name: Verify downloaded Windows executable
        shell: bash
        run: |
          set -euo pipefail
          test -s Polytoria/native/luau-lsp/windows/luau-lsp.exe
          file Polytoria/native/luau-lsp/windows/luau-lsp.exe | grep -q 'PE32+'

      - name: Commit updated binary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Polytoria/native/luau-lsp/windows/luau-lsp.exe

          if git diff --cached --quiet; then
            echo "Bundled binary is already current."
            exit 0
          fi

          git commit -m "Update bundled Luau LSP to 1.69.0"
          git push origin HEAD:feature/module-intellisense
